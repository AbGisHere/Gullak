packages:
  - apps/*
  - packages/*

# Single source of truth for dependency versions. Packages reference these
# with "catalog:" so all workspaces stay on the same version.
catalog:
  "@ai-sdk/google": 4.0.93
  "@ai-sdk/groq": 4.0.59
  "@base-ui/react": 1.9.0
  "@biomejs/biome": 2.5.15
  "@playwright/test": 1.64.0
  "@serwist/turbopack": 9.5.13
  "@supabase/ssr": 0.12.7
  "@supabase/supabase-js": 2.117.3
  "@tailwindcss/postcss": 4.3.3
  "@tanstack/react-query": 5.104.1
  "@testing-library/react": 16.3.3
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  ai: 7.0.137
  class-variance-authority: 0.7.1
  cn: 0.4.0
  esbuild: 0.28.2
  jsdom: 30.1.2
  katex: 0.19.0
  lightweight-charts: 5.2.1
  lucide-react: 1.55.0
  motion: 14.1.0
  next: 16.4.0
  next-intl: 4.14.9
  next-themes: 0.4.6
  react: 19.3.0
  react-dom: 19.3.0
  serwist: 9.5.13
  shadcn: 4.21.4
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  typescript: 6.0.3
  vitest: 5.0.3
  zod: 4.6.5
  zustand: 5.0.15

minimumReleaseAgeExclude:
  - "@types/node@24.19.2"
  - ai@7.0.137
  - framer-motion@14.1.0
  - lucide-react@1.55.0
  - motion-dom@14.1.0
  - motion-utils@14.1.0
  - motion@14.1.0

# Packages allowed to run install scripts (pnpm blocks all others by default).
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
