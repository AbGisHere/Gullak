name: CI

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules:
    name: Git rules (attribution, commits)
    # The graded submission repo only receives releases already green here.
    if: github.repository != 'IIIT-ECell/megathon26-claude2create'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No AI attribution in PR title/body
        if: github.event_name == 'pull_request'
        env:
          PR_TEXT: ${{ github.event.pull_request.title }}

            ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_TEXT" | node scripts/check-attribution.mjs
      - name: Commit messages (attribution + Conventional Commits)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
            # A new branch has no previous push: check only its own commits, not all of main's history.
            git cat-file -e "${{ github.event.before }}" 2>/dev/null || range="origin/${{ github.event.repository.default_branch }}..${{ github.sha }}"
          fi
          for sha in $(git rev-list --no-merges $range); do
            git log -1 --format=%B "$sha" > /tmp/msg
            node scripts/check-attribution.mjs /tmp/msg
            pnpm exec commitlint --edit /tmp/msg
          done

  verify:
    name: Lint · typecheck · test · build
    if: github.repository != 'IIIT-ECell/megathon26-claude2create'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r notebooks/requirements-test.txt
      - name: Notebook tests (input checks, BKT fitting, benchmark code on fake data)
        run: python -B -m unittest discover -s notebooks -p 'test_*.py'
      - run: pnpm build
      - name: Release metadata (main)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release.mjs

  e2e:
    name: E2E (phone + desktop)
    if: github.repository != 'IIIT-ECell/megathon26-claude2create'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gullak/web exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
